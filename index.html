<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <div class="logo">Event<span>Hub</span></div>
  <div class="role" role="group" aria-label="View as">
    <button id="asAttendee" aria-pressed="true">Attendee</button>
    <button id="asOrganizer" aria-pressed="false">Organizer</button>
  </div>
  <div class="bell-wrap">
    <button class="icon-btn bell" id="bell" aria-label="Notifications" aria-expanded="false" aria-controls="notePanel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="bellBadge" hidden>0</span>
    </button>
    <div class="note-panel" id="notePanel" hidden>
      <div class="note-head"><b>Notifications</b><button class="link-btn" id="clearNotes">Clear all</button></div>
      <ul class="note-list" id="noteList"></ul>
    </div>
  </div>
</div></header>

<main><div class="wrap">
  <div>
    <h1>All events in one place</h1>
    <p class="sub">Browse, search and register for events · Organizers create and manage their own</p>
  </div>
  <div class="tools">
    <label class="search" for="q" aria-label="Search events">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by event name or keyword">
    </label>
    <button class="btn" id="newBtn" hidden>+ Create event</button>
  </div>
  <div class="filters">
    <label for="fltType" class="flt">Type
      <select id="fltType"><option value="">All types</option><option>Workshop</option><option>Conference</option><option>Exhibition</option><option>Sports</option><option>Social</option></select>
    </label>
    <label for="fltFrom" class="flt">From<input id="fltFrom" type="date"></label>
    <label for="fltTo" class="flt">To<input id="fltTo" type="date"></label>
    <button class="btn ghost small" id="clearFlt" hidden>Clear filters</button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Event lists">
    <button role="tab" id="tabAll" data-tab="all" aria-selected="true">All events</button>
    <button role="tab" id="tabMine" data-tab="mine" aria-selected="false">My events <span class="n" id="nMine">0</span></button>
    <button role="tab" id="tabFav" data-tab="fav" aria-selected="false">Favorites <span class="n" id="nFav">0</span></button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <p class="note">Sample events are examples. Data is saved in this browser only. <button class="btn ghost small" id="reset">Reset demo</button></p>
</div></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-labelledby="ph">
  <h2 id="ph">Create a new event</h2>
  <p class="sub" id="psub">Attendees will see it right away and can register.</p>
  <form id="form" novalidate>
    <label for="fName">Event name<input id="fName" required maxlength="80" placeholder="e.g. Women in Tech Meetup"></label>
    <label for="fType">Type
      <select id="fType"><option>Workshop</option><option>Conference</option><option>Exhibition</option><option>Sports</option><option>Social</option></select>
    </label>
    <div class="two">
      <label for="fDate">Date<input id="fDate" type="date" required></label>
      <label for="fTime">Time<input id="fTime" type="time" required value="18:00"></label>
    </div>
    <label for="fPlace">Location<input id="fPlace" required placeholder="e.g. Riyadh Front, Hall B"></label>
    <label for="fSeats">Capacity (seats)<input id="fSeats" type="number" min="1" max="10000" required value="50"></label>
    <p class="err" id="err"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Publish event</button>
    </div>
  </form>
</aside>
<div class="toast" id="toast" hidden></div>
<div class="share-box" id="shareBox" hidden>
  <label for="shareUrl">Copy this link and send it to your friends</label>
  <div class="share-row"><input id="shareUrl" readonly><button class="btn small" id="shareClose">Done</button></div>
</div>

<script src="app.js"></script>
</body>
</html>
